[project]
name = "agent-c"
version = "0.1.0"
description = "Agent C is a simple code editing assistant powered by Pydantic AI, supporting multiple LLM providers and delegation to sub-agents."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "prompt-toolkit>=3.0.52",
    "pydantic-ai>=1.6.0",
    "textual>=6.7.0",
]
license = "MIT"

[dependency-groups]
dev = ["mypy>=1.18.2", "pytest>=8.4.2", "ruff>=0.14.2", "isort>=5.12.0"]

[build-system]
requires = ["uv_build>=0.9.6,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentc"
source-include = [
    "agentc/*.py",
    "agentc/*.toml",
    "agentc/prompts/*.md",
    "agentc/ui/*.py",
    "agentc_next/*.py",
]

[project.scripts]
agent-c = "agentc.agent:main"
run-console = "agentc_next.ui.run_console:main"
run-textual = "agentc_next.ui.run_textual:main"
